name: Etodo
options:
  bundleIdPrefix: app.etodo
  developmentLanguage: tr
  deploymentTarget:
    macOS: "14.0"
packages:
  MedyaCore:
    path: MedyaCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
targets:
  Etodo:
    type: application
    platform: macOS
    sources: [App]
    info:
      path: App/Info.plist
      properties:
        # Menü çubuğu ve Dock'taki ad: MedyaCore/AppIdentity.displayName ile elle aynı tutulmalı.
        CFBundleName: "Etodo"
        CFBundleDisplayName: "Etodo"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SUFeedURL: $(UPDATE_FEED_URL)
        SUPublicEDKey: URQV1JOmUEMuRhI4XD1JrAEakiSLcWo2qc+7UgjOeq8=
        SUScheduledCheckInterval: 172800
        SUEnableAutomaticChecks: true
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.utilities
    dependencies:
      - package: MedyaCore
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.etodo.mac
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ARCHS: $(ARCHS_STANDARD)
        CODE_SIGN_IDENTITY: "-"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        # Info.plist elle (info.properties); üretilen plist CFBundleName'i PRODUCT_NAME ile ezer.
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # TODO(Görev 12): OWNER/REPO gerçek GitHub deposuyla değiştirilecek (tek yer burası).
        UPDATE_FEED_URL: https:/$()/github.com/OWNER/REPO/releases/latest/download/appcast.xml
