name: MedyaIndirici
options:
  bundleIdPrefix: app.medyaindirici
  developmentLanguage: tr
  deploymentTarget:
    macOS: "14.0"
packages:
  MedyaCore:
    path: MedyaCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
targets:
  MedyaIndirici:
    type: application
    platform: macOS
    sources: [App]
    info:
      path: App/Info.plist
      properties:
        # Menü çubuğu ve Dock'taki ad: MedyaCore/AppIdentity.displayName ile elle aynı tutulmalı.
        CFBundleName: "Medya İndirici"
        CFBundleDisplayName: "Medya İndirici"
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.utilities
    dependencies:
      - package: MedyaCore
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.medyaindirici.mac
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ARCHS: $(ARCHS_STANDARD)
        CODE_SIGN_IDENTITY: "-"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        # Info.plist elle (info.properties); üretilen plist CFBundleName'i PRODUCT_NAME ile ezer.
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "6.0"
